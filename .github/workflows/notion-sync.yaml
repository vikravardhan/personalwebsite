name: Sync Notion Recommendations

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch Notion recommendations
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: npx tsx scripts/fetch-notion.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/recommendations/data.json
          git diff --cached --quiet || git commit -m "Update recommendations from Notion"
          git push
